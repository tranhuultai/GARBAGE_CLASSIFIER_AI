name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Chay pylint
        working-directory: CODE
        run: pylint $(git ls-files '*.py') --max-line-length=100

      - name: Chay pytest
        working-directory: CODE
        run: pytest tests/ -v
